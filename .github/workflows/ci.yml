name: CI

on:
  push:
    branches: [master]
  pull_request:

# A new push to the same branch cancels an in-flight run for it
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint and test
    runs-on: ubuntu-latest

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          # Matches the "Node.js 18 or newer" requirement in the README
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        # vitest watches by default; test:run is the single-pass script
        run: npm run test:run
